site_name: Defra AI Agent Documentation
site_description: AI-powered environmental incident reporting system
site_author: Defra AI Innovation Team
repo_url: https://github.com/steve-dickinson/agentic-incident-reporting
repo_name: agentic-incident-reporting

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light-green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [app]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Quick Start: guides/getting_started.md
    - Installation: guides/installation.md
    - Configuration: guides/configuration.md
  - Architecture:
    - System Design: architecture/system_design.md
    - Data Model: architecture/data_model.md
    - API Reference: architecture/api.md
  - Guides:
    - Development Guide: guides/development.md
    - Testing Guide: guides/testing.md
    - Deployment Guide: guides/deployment.md
  - Examples:
    - Basic Usage: examples/basic_usage.md
    - Advanced Scenarios: examples/advanced.md
  - API Reference:
    - Agents: api/agents.md
    - Tools: api/tools.md
    - Models: api/models.md
  - About:
    - Progress Log: progress.md
    - Contributing: contributing.md
    - License: license.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/steve-dickinson
    - icon: fontawesome/brands/python
      link: https://www.python.org
  
  version:
    provider: mike

copyright: Copyright &copy; 2025 Defra AI Innovation Team
