name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12"]
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      neo4j:
        image: neo4j:5.16.0
        env:
          NEO4J_AUTH: neo4j/test_password
        ports:
          - 7687:7687
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    
    - name: Set up Python ${{ matrix.python-version }}
      run: uv venv --python ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        source .venv/bin/activate
        # Stop the build if there are Python syntax errors or undefined names
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 app --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
    
    - name: Format check with black
      run: |
        source .venv/bin/activate
        black --check app tests
    
    - name: Type check with mypy
      run: |
        source .venv/bin/activate
        mypy app --ignore-missing-imports || true
    
    - name: Run tests with pytest
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
        POSTGRES_HOST: localhost
        POSTGRES_PASSWORD: test_password
        POSTGRES_DB: test_db
        NEO4J_URI: bolt://localhost:7687
        NEO4J_PASSWORD: test_password
        NOTIFY_API_KEY: test-key
        NOTIFY_TEST_MODE: true
        SECRET_KEY: test-secret-key-for-ci
      run: |
        source .venv/bin/activate
        pytest tests/ --cov=app --cov-report=xml --cov-report=term-missing || true
    
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      if: matrix.python-version == '3.12'
  
  build-docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Set up Python
      run: uv venv --python 3.12
    
    - name: Install dependencies
      run: |
        source .venv/bin/activate
        uv pip install -e ".[docs]"
    
    - name: Build documentation
      run: |
        source .venv/bin/activate
        mkdocs build --strict
    
    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: site/

  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: defra-agent:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
